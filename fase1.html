<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   
</head>

<body>
    
    <link rel="stylesheet" href="styleFase1.css">

    <!-- container com os botões no canto inferior direito -->
    <div class="voltar-container">
        <!-- botão Tela inicial -->
        <button type="button" class="buttonVoltar" onclick="window.location.href='index.html'" aria-label="Tela inicial">
            <img class="imgVoltar" src="image/botao.png" alt="Tela inicial">
            <span class="button-label">Tela inicial</span>
        </button>

        <!-- botão de áudio (mesmo formato, usa botao.png) -->
        <button type="button" id="audioToggle" class="buttonVoltar audio-button"
            data-audio="audio/fase1.mp3" aria-pressed="false" aria-label="Som da fase">
            <img class="imgVoltar" src="image/botao.png" alt="Som">
            <span class="button-label audio-label">Som</span>
        </button>
    </div>

    <!-- elemento de áudio com src (coloque audio/fase1.mp3 na pasta audio/) -->
    <audio id="audio-fase1" src="TrabalhoADS-audios/TrabalhoADS-audios/Fases&Descricao/enunciado-fase1.mp3" preload="auto"></audio>

    <script>
    // quick toggle caso o script principal não esteja funcionando
    (function(){
        const audio = document.getElementById('audio-fase1');
        const btn = document.getElementById('audioToggle');
        if (!audio || !btn) return;

        btn.addEventListener('click', () => {
            // pausa outros audios
            document.querySelectorAll('audio').forEach(a => { if (a !== audio) { a.pause(); a.currentTime = 0; } });

            if (audio.paused) {
                audio.currentTime = 0;
                audio.play().then(() => {
                    btn.classList.add('playing');
                    btn.querySelector('.audio-label').textContent = 'Pausar';
                }).catch(err => {
                    console.warn('Erro ao tocar áudio:', err);
                });
            } else {
                audio.pause();
                audio.currentTime = 0;
                btn.classList.remove('playing');
                btn.querySelector('.audio-label').textContent = 'Audio';
            }
        });

        audio.addEventListener('ended', () => {
            btn.classList.remove('playing');
            btn.querySelector('.audio-label').textContent = 'Audio';
        });
    })();
    </script>

    <script>
(function () {
    const btn = document.getElementById('audioToggle');
    const audioEl = document.getElementById('audio-fase1');

    if (!btn) { console.warn('Botão audioToggle não encontrado'); return; }

    // preferência: data-audio do botão -> src do <audio> -> audio/fase1.mp3
    const preferredSrc = btn.getAttribute('data-audio') || (audioEl && audioEl.getAttribute('src')) || 'audio/fase1.mp3';
    console.log('audio debug: preferredSrc=', preferredSrc, 'audioEl.src=', audioEl ? audioEl.src : null);

    function stopAllExcept(active) {
        document.querySelectorAll('audio').forEach(a => {
            if (a !== active) { try { a.pause(); a.currentTime = 0; } catch (e) {} }
        });
    }

    async function playSrc(src) {
        try {
            // use <audio> element se ele tiver o mesmo src, senão cria Audio()
            let a = audioEl && (audioEl.getAttribute('src') === src || (audioEl.src && audioEl.src.endsWith(src))) ? audioEl : new Audio(src);
            a.preload = 'auto';
            a.muted = false;
            a.volume = a.volume || 1;
            stopAllExcept(a);
            a.currentTime = 0;
            const p = a.play();
            if (p && p.then) {
                await p;
            }
            btn.classList.add('playing');
            const label = btn.querySelector('.audio-label');
            if (label) label.textContent = 'Pausar';
            a.addEventListener('ended', () => {
                btn.classList.remove('playing');
                if (label) label.textContent = 'Som';
            }, { once: true });
        } catch (err) {
            console.warn('Erro ao reproduzir áudio:', err);
            alert('Não foi possível reproduzir o áudio. Verifique o caminho do arquivo (Console/Network em F12).');
        }
    }

    btn.addEventListener('click', () => {
        playSrc(preferredSrc);
        // garante que as formas continuem visíveis
        if (typeof drawShapes === 'function') setTimeout(drawShapes, 50);
    });
})();
</script>

    <div class="bgFase1">
      
            <canvas id="drawCanvas" width="1920" height="1080"
                style="position:absolute; left:0; top:0; pointer-events:auto;"></canvas>
        </div>
    </div>

  
    <div class="color-picker">
        <button class="color-btn" data-color="#222" style="background:#222"></button>
        <button class="color-btn" data-color="#e74c3c" style="background:#e74c3c"></button>
        <button class="color-btn" data-color="#3498db" style="background:#3498db"></button>
        <button class="color-btn" data-color="#27ae60" style="background:#27ae60"></button>
        <button class="color-btn" data-color="#f1c40f" style="background:#f1c40f"></button>
        <button class="color-btn" data-color="#9b59b6" style="background:#9b59b6"></button>
        <button class="color-btn" data-color="#ff9800" style="background:#ff9800"></button>
        <button class="color-btn" data-color="#00bcd4" style="background:#00bcd4"></button>
    </div>

    <script src="fase1script.js"></script>
</body>

</html>
